[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wyndle"
dynamic = ["version"]
description = "ADHD-Aware Productivity System for the Terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "markdown-it-py>=2.2",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
wyndle = "wyndle.cli:main"

[tool.setuptools.dynamic]
version = {attr = "wyndle.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyndle = ["*.yaml"]
"wyndle.web" = ["*.html", "*.css", "*.js", "*.md", "*.svg", "*.png", "*.ico", "components/*.js", "assets/*.jpg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
