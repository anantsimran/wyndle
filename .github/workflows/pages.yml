name: Publish how-to guide

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - scripts/build_guide.py
      - scripts/guide-template.html
      - src/wyndle/web/HOW_TO_USE.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - run: python -m pip install markdown-it-py==4.2.0
      - run: python scripts/build_guide.py --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
